<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campaign Frame Generator</title>
<style>
/* ------------------------ */
/* GOOGLE-LIKE UI & RESET */
/* ------------------------ */
* { margin:0; padding:0; box-sizing:border-box; font-family:"Roboto","Segoe UI",sans-serif; }
body { background:#f1f3f4; min-height:100vh; display:flex; justify-content:center; align-items:flex-start; padding:20px; }
.container { width:100%; max-width:720px; background:#fff; border-radius:12px; box-shadow:0 2px 6px rgba(0,0,0,0.15); padding:30px; text-align:center; margin-top:30px; }
h2 { font-size:1.8rem; font-weight:500; color:#202124; margin-bottom:20px; }
label { display:block; text-align:left; font-size:0.9rem; color:#3c4043; margin:12px 0 6px 0; }
select,input[type="file"] { width:100%; padding:12px; border-radius:8px; border:1px solid #dadce0; outline:none; font-size:1rem; transition:0.2s; }
select:focus,input:focus { border-color:#1a73e8; box-shadow:0 0 0 2px rgba(26,115,232,0.15); }

/* Banner */
#bannerDisplay { width:100%; max-height:250px; object-fit:contain; border-radius:12px; margin-bottom:20px; display:none; box-shadow:0 2px 8px rgba(0,0,0,0.15); }

/* Canvas */
canvas { width:100%; margin-top:20px; border-radius:12px; display:none; box-shadow:0 2px 8px rgba(0,0,0,0.2); }

/* Frame Thumbnails */
#frameThumbnails { display:flex; gap:10px; overflow-x:auto; margin-top:15px; padding-bottom:5px; }
#frameThumbnails img { width:80px; height:80px; object-fit:cover; cursor:pointer; border:2px solid transparent; border-radius:6px; transition:0.2s; }
#frameThumbnails img.selected { border-color:#1a73e8; }

/* Button */
button { margin-top:20px; width:100%; padding:14px; font-size:1rem; border-radius:8px; border:none; cursor:pointer; background-color:#1a73e8; color:white; font-weight:500; transition:0.25s; }
button:hover { background-color:#1669c1; }

/* Hide controls initially */
.hidden { display:none; }

/* Mobile */
@media(max-width:600px){ .container { padding:20px; } h2 { font-size:1.5rem; } #frameThumbnails img { width:60px; height:60px; } }
</style>
</head>

<body>
<div class="container">
    <h2>Campaign Frame Generator</h2>

    <img id="bannerDisplay" alt="Campaign Banner">

    <label for="campaignSelect">1. Select Campaign</label>
    <select id="campaignSelect">
        <option value="" disabled selected>Loading campaigns...</option>
    </select>

    <div id="controls" class="hidden">
        <label>2. Select Frame</label>
        <div id="frameThumbnails"></div>

        <label>3. Upload Your Photo</label>
        <input type="file" id="userImage" accept="image/*">

        <label>4. Adjust Image</label>
        <p style="font-size:0.8rem;color:#5f6368;">Drag to move, pinch/scroll to zoom</p>
    </div>

    <canvas id="canvas"></canvas>
    <button id="downloadBtn" style="display:none;">Download Image</button>
</div>

<script>
/* ------------------------ */
/* VARIABLES */
/* ------------------------ */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const campaignSelect = document.getElementById('campaignSelect');
const bannerDisplay = document.getElementById('bannerDisplay');
const controls = document.getElementById('controls');
const frameThumbnails = document.getElementById('frameThumbnails');
const userImageInput = document.getElementById('userImage');
const downloadBtn = document.getElementById('downloadBtn');

let campaigns = [];
let currentCampaign = null;

let frameImg = new Image();
let userImg = new Image();
let isFrameLoaded = false;
let isUserLoaded = false;

// For image adjustments
let imgPos = {x:0,y:0,scale:1};
let dragging = false;
let lastMouse = {x:0,y:0};

/* ------------------------ */
/* LOAD CAMPAIGNS */
fetch('config.json?t=' + Date.now())
.then(res => res.json())
.then(data => {
    campaigns = data;
    campaignSelect.innerHTML = '<option value="" disabled selected>Select a Campaign</option>';
    campaigns.forEach((c,i)=>{
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = c.name;
        campaignSelect.appendChild(opt);
    });
});

/* ------------------------ */
/* CAMPAIGN SELECT */
campaignSelect.addEventListener('change', e => {
    currentCampaign = campaigns[e.target.value];
    controls.classList.remove('hidden');

    // Banner
    if(currentCampaign.bannerUrl){
        bannerDisplay.src = currentCampaign.bannerUrl;
        bannerDisplay.onload = ()=> bannerDisplay.style.display='block';
    } else bannerDisplay.style.display='none';

    loadFrameThumbnails();
    loadFrame(0);
});

/* ------------------------ */
/* FRAME THUMBNAILS */
function loadFrameThumbnails(){
    frameThumbnails.innerHTML='';
    currentCampaign.frames.forEach((f,i)=>{
        const img = document.createElement('img');
        img.src = f.url;
        if(i===0) img.classList.add('selected');
        img.addEventListener('click', ()=>{
            loadFrame(i);
            document.querySelectorAll('#frameThumbnails img').forEach(im=>im.classList.remove('selected'));
            img.classList.add('selected');
        });
        frameThumbnails.appendChild(img);
    });
}

/* ------------------------ */
/* LOAD FRAME */
function loadFrame(index){
    isFrameLoaded = false;
    frameImg.src = currentCampaign.frames[index].url;
    frameImg.onload = ()=> { isFrameLoaded = true; draw(); }
}

/* ------------------------ */
/* LOAD USER IMAGE */
userImageInput.addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
        userImg.src = ev.target.result;
        userImg.onload = ()=> {
            isUserLoaded = true;
            // Reset position
            imgPos = {x:canvas.width/2, y:canvas.height/2, scale:1};
            draw();
        };
    }
    reader.readAsDataURL(file);
});

/* ------------------------ */
/* IMAGE ADJUSTMENTS (DRAG & ZOOM) */
canvas.addEventListener('mousedown', e=>{ dragging=true; lastMouse={x:e.offsetX, y:e.offsetY}; });
canvas.addEventListener('mousemove', e=>{
    if(dragging){
        imgPos.x += e.offsetX - lastMouse.x;
        imgPos.y += e.offsetY - lastMouse.y;
        lastMouse = {x:e.offsetX, y:e.offsetY};
        draw();
    }
});
canvas.addEventListener('mouseup', ()=>dragging=false);
canvas.addEventListener('mouseleave', ()=>dragging=false);
canvas.addEventListener('wheel', e=>{
    e.preventDefault();
    const scaleAmount = e.deltaY>0?0.95:1.05;
    imgPos.scale *= scaleAmount;
    draw();
});

/* ------------------------ */
/* DRAW FUNCTION */
function draw(){
    if(!isFrameLoaded || !isUserLoaded) return;

    canvas.width = frameImg.width;
    canvas.height = frameImg.height;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Draw user image
    const iw = userImg.width * imgPos.scale;
    const ih = userImg.height * imgPos.scale;
    ctx.drawImage(userImg, 0,0,userImg.width,userImg.height, imgPos.x - iw/2, imgPos.y - ih/2, iw, ih);

    // Draw frame
    ctx.drawImage(frameImg,0,0);

    canvas.style.display='block';
    downloadBtn.style.display='inline-block';
}

/* ------------------------ */
/* DOWNLOAD BUTTON */
downloadBtn.addEventListener('click', ()=>{
    const link = document.createElement('a');
    link.download = 'campaign_frame.png';
    link.href = canvas.toDataURL();
    link.click();
});
</script>
</body>
</html>
