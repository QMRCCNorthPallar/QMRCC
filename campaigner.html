<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campaign Frame Generator</title>

<style>
/* ------------------------ */
/* GLOBAL RESET */
/* ------------------------ */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
}

/* ------------------------ */
/* BACKGROUND */
/* ------------------------ */
body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1e293b, #0f172a, #1e3a8a);
    background-size: 200% 200%;
    animation: bgMove 12s ease infinite;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}
@keyframes bgMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* ------------------------ */
/* GLASS CARD */
/* ------------------------ */
.container {
    width: 100%;
    max-width: 650px;
    background: rgba(255, 255, 255, 0.12);
    padding: 30px;
    border-radius: 22px;
    backdrop-filter: blur(18px);
    box-shadow: 0 8px 40px rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.18);
    text-align: center;
    animation: fadeUp 0.8s ease;
}
@keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* ------------------------ */
/* HEADER */
/* ------------------------ */
h2 {
    color: white;
    font-size: 1.8rem;
    margin-bottom: 25px;
    font-weight: 600;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
}

/* ------------------------ */
/* BANNER */
/* ------------------------ */
#bannerDisplay {
    width: 100%;
    border-radius: 16px;
    margin-bottom: 20px;
    display: none;
    max-height: 220px;
    object-fit: cover;
    box-shadow: 0 6px 25px rgba(0,0,0,0.35);
}

/* ------------------------ */
/* INPUTS & SELECTS */
/* ------------------------ */
label {
    display: block;
    margin-top: 14px;
    margin-bottom: 6px;
    color: #e2e8f0;
    text-align: left;
    font-size: 0.95rem;
}

select, input[type="text"], input[type="file"] {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    outline: none;
    border: none;
    font-size: 1rem;
    background: rgba(255,255,255,0.14);
    color: #fff;
    box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.2);
    transition: 0.2s ease;
}
select:focus, input:focus {
    background: rgba(255,255,255,0.25);
}

/* ------------------------ */
/* CANVAS */
/* ------------------------ */
canvas {
    width: 100%;
    border-radius: 16px;
    margin-top: 25px;
    display: none;
    box-shadow: 0 6px 35px rgba(0,0,0,0.4);
}

/* ------------------------ */
/* BUTTON */
/* ------------------------ */
button {
    margin-top: 25px;
    width: 100%;
    padding: 16px;
    font-size: 1.15rem;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    color: white;
    font-weight: 600;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    box-shadow: 0 6px 18px rgba(0,0,0,0.3);
    transition: 0.25s ease;
}
button:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

/* Hide sections */
.hidden { display: none; }

/* ------------------------ */
/* MOBILE */
/* ------------------------ */
@media(max-width: 600px) {
    h2 { font-size: 1.5rem; }
    .container { padding: 20px; }
}
</style>
</head>

<body>

<div class="container">

    <img id="bannerDisplay" alt="Campaign Banner">

    <h2>Campaign Frame Generator</h2>

    <label for="campaignSelect">1. Select Campaign</label>
    <select id="campaignSelect">
        <option value="" disabled selected>Loading...</option>
    </select>

    <div id="controls" class="hidden">
        <label for="formatSelect">2. Select Format</label>
        <select id="formatSelect"></select>

        <label for="userText">3. Enter Your Name</label>
        <input type="text" id="userText" placeholder="Your Name">

        <label for="userImage">4. Upload Your Photo</label>
        <input type="file" id="userImage" accept="image/*">
    </div>

    <canvas id="canvas"></canvas>

    <button id="downloadBtn" style="display:none;">Download Image</button>

</div>

<script>
/* ------------------------ */
/* JS FUNCTIONALITY */
/* ------------------------ */

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const campaignSelect = document.getElementById('campaignSelect');
const formatSelect = document.getElementById('formatSelect');
const bannerDisplay = document.getElementById('bannerDisplay');
const controls = document.getElementById('controls');

let campaigns = [];
let currentCampaign = null;

let frameImg = new Image();
let userImg = new Image();

let isFrameLoaded = false;
let isUserLoaded = false;

/* Load config */
fetch('config.json?t=' + Date.now())
    .then(res => res.json())
    .then(data => {
        campaigns = data;
        campaignSelect.innerHTML = '<option value="" disabled selected>Select a Campaign</option>';
        data.forEach((c, i) => {
            let opt = document.createElement('option');
            opt.value = i;
            opt.textContent = c.name;
            campaignSelect.appendChild(opt);
        });
    });

/* Campaign Selected */
campaignSelect.addEventListener('change', (e) => {
    currentCampaign = campaigns[e.target.value];

    /* Banner */
    if (currentCampaign.bannerUrl) {
        bannerDisplay.src = currentCampaign.bannerUrl;
        bannerDisplay.style.display = "block";
    } else {
        bannerDisplay.style.display = "none";
    }

    /* Frame Formats */
    formatSelect.innerHTML = '';
    currentCampaign.frames.forEach((f, i) => {
        let opt = document.createElement('option');
        opt.value = i;
        opt.textContent = f.type;
        formatSelect.appendChild(opt);
    });

    document.getElementById('userText').value = currentCampaign.defaultText || "";
    controls.classList.remove('hidden');

    loadFrame(0);
});

/* Load Frame */
formatSelect.addEventListener('change', (e) => loadFrame(e.target.value));

function loadFrame(index) {
    isFrameLoaded = false;
    frameImg.src = currentCampaign.frames[index].url;
    frameImg.onload = () => { 
        isFrameLoaded = true; 
        draw(); 
    };
}

/* Load User Image */
document.getElementById('userImage').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (ev) => {
        userImg.src = ev.target.result;
        userImg.onload = () => {
            isUserLoaded = true;
            draw();
        };
    };
    reader.readAsDataURL(file);
});

document.getElementById('userText').addEventListener('input', draw);

/* Draw to Canvas */
function draw() {
    if (!isFrameLoaded || !isUserLoaded) return;

    canvas.width = frameImg.width;
    canvas.height = frameImg.height;

    const ratio = Math.max(canvas.width / userImg.width, canvas.height / userImg.height);
    const shiftX = (canvas.width - userImg.width * ratio) / 2;
    const shiftY = (canvas.height - userImg.height * ratio) / 2;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.drawImage(userImg, 0, 0, userImg.width, userImg.height,
        shiftX, shiftY, userImg.width * ratio, userImg.height * ratio);

    ctx.drawImage(frameImg, 0, 0);

    const text = document.getElementById('userText').value;
    if (text) {
        ctx.font = `bold ${canvas.height * 0.05}px Arial`;
        ctx.fillStyle = currentCampaign.textColor || "white";
        ctx.textAlign = "center";
        ctx.shadowColor="black";
        ctx.shadowBlur=6;
        ctx.fillText(text, canvas.width / 2, canvas.height - (canvas.height * 0.1));
    }

    canvas.style.display = "block";
    document.getElementById('downloadBtn').style.display = "inline-block";
}

/* Download Button */
document.getElementById('downloadBtn').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = 'campaign_frame.png';
    link.href = canvas.toDataURL();
    link.click();
});

</script>

</body>
</html>
