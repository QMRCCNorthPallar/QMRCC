<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campaign Frame Generator</title>
<style>
/* ------------------------ */
/* GOOGLE-LIKE UI */
/* ------------------------ */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Roboto", "Segoe UI", sans-serif;
}

body {
    min-height: 100vh;
    background: #f1f3f4;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px;
}

/* ------------------------ */
/* CARD */
/* ------------------------ */
.container {
    width: 100%;
    max-width: 700px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    padding: 30px;
    text-align: center;
    margin-top: 30px;
}

h2 {
    font-size: 1.8rem;
    font-weight: 500;
    color: #202124;
    margin-bottom: 20px;
}

/* ------------------------ */
/* BANNER */
/* ------------------------ */
#bannerDisplay {
    width: 100%;
    max-height: 250px;
    object-fit: contain;
    border-radius: 12px;
    margin-bottom: 20px;
    display: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

/* ------------------------ */
/* INPUTS */
/* ------------------------ */
label {
    display: block;
    font-size: 0.9rem;
    color: #3c4043;
    margin-bottom: 6px;
    text-align: left;
    margin-top: 12px;
}

select, input[type="file"] {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #dadce0;
    font-size: 1rem;
    outline: none;
    transition: 0.2s;
}

select:focus, input:focus {
    border-color: #1a73e8;
    box-shadow: 0 0 0 2px rgba(26,115,232,0.15);
}

/* ------------------------ */
/* CANVAS */
/* ------------------------ */
canvas {
    width: 100%;
    margin-top: 20px;
    border-radius: 12px;
    display: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

button {
    margin-top: 20px;
    width: 100%;
    padding: 14px;
    font-size: 1rem;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    background-color: #1a73e8;
    color: white;
    font-weight: 500;
    transition: 0.25s;
}

button:hover {
    background-color: #1669c1;
}

.hidden { display: none; }

@media(max-width: 600px){
    .container { padding: 20px; }
    h2 { font-size: 1.5rem; }
}
</style>
</head>

<body>
<div class="container">

    <h2>QMRCC Campaigner</h2>

    <img id="bannerDisplay" alt="Campaign Banner">

    <label for="campaignSelect">1. Select Campaign</label>
    <select id="campaignSelect">
        <option value="" disabled selected>Loading campaigns...</option>
    </select>

    <div id="controls" class="hidden">
        <label for="formatSelect">2. Select Frame</label>
        <select id="formatSelect"></select>

        <label for="userImage">3. Upload Your Photo</label>
        <input type="file" id="userImage" accept="image/*">
    </div>

    <canvas id="canvas"></canvas>

    <button id="downloadBtn" style="display:none;">Download Image</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const campaignSelect = document.getElementById('campaignSelect');
const formatSelect = document.getElementById('formatSelect');
const bannerDisplay = document.getElementById('bannerDisplay');
const controls = document.getElementById('controls');
const downloadBtn = document.getElementById('downloadBtn');

let campaigns = [];
let currentCampaign = null;
let frameImg = new Image();
let userImg = new Image();
let isFrameLoaded = false;
let isUserLoaded = false;

// Load config.json
fetch('config.json?t=' + Date.now())
.then(res => res.json())
.then(data => {
    campaigns = data;
    campaignSelect.innerHTML = '<option value="" disabled selected>Select a Campaign</option>';
    data.forEach((c, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = c.name;
        campaignSelect.appendChild(opt);
    });
});

// Campaign selection
campaignSelect.addEventListener('change', e => {
    currentCampaign = campaigns[e.target.value];

    if (currentCampaign.bannerUrl) {
        bannerDisplay.src = currentCampaign.bannerUrl;
        bannerDisplay.style.display = 'block';
    } else {
        bannerDisplay.style.display = 'none';
    }

    formatSelect.innerHTML = '';
    currentCampaign.frames.forEach((f, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = f.type;
        formatSelect.appendChild(opt);
    });

    controls.classList.remove('hidden');

    // FIX: Ensure options load before loading first frame
    setTimeout(() => loadFrame(0), 0);
});

// FIX: Convert value to number
formatSelect.addEventListener('change', e => {
    loadFrame(Number(e.target.value));
});

function loadFrame(index) {
    isFrameLoaded = false;
    frameImg.src = currentCampaign.frames[index].url;
    frameImg.onload = () => {
        isFrameLoaded = true;
        draw();
    };
}

// User Image upload
document.getElementById('userImage').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = ev => {
        userImg.src = ev.target.result;
        userImg.onload = () => {
            isUserLoaded = true;
            draw();
        };
    };
    reader.readAsDataURL(file);
});

// DRAW FUNCTION
function draw() {
    if (!isFrameLoaded || !isUserLoaded) return;

    canvas.width = frameImg.naturalWidth;
    canvas.height = frameImg.naturalHeight;

    const canvasW = canvas.width;
    const canvasH = canvas.height;
    const imgW = userImg.naturalWidth;
    const imgH = userImg.naturalHeight;

    const frameRatio = canvasW / canvasH;
    const imgRatio = imgW / imgH;

    let drawW, drawH;

    if (imgRatio > frameRatio) {
        drawH = canvasH;
        drawW = drawH * imgRatio;
    } else {
        drawW = canvasW;
        drawH = drawW / imgRatio;
    }

    const offsetX = (canvasW - drawW) / 2;
    const offsetY = (canvasH - drawH) / 2;

    ctx.clearRect(0, 0, canvasW, canvasH);
    ctx.drawImage(userImg, offsetX, offsetY, drawW, drawH);
    ctx.drawImage(frameImg, 0, 0, canvasW, canvasH);

    canvas.style.display = "block";
    downloadBtn.style.display = "inline-block";
}

// Download button
downloadBtn.addEventListener('click', () => {
    const dataURL = canvas.toDataURL('image/png');

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        const win = window.open();
        win.document.write('<img src="' + dataURL + '" style="width:100%">');
        return;
    }

    const link = document.createElement('a');
    link.download = 'campaign_frame.png';
    link.href = dataURL;
    link.click();
});
</script>
</body>
</html>
