<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campaign Frame Generator</title>
    <style>
        /* Reset some default styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body and overall container styles */
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h2 {
            color: #333;
            font-size: 1.6rem;
            margin-bottom: 20px;
        }

        /* Banner image styles */
        #bannerDisplay {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            object-fit: cover;
            max-height: 200px;
        }

        /* Select and input field styling */
        select, input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-size: 1rem;
        }

        label {
            font-weight: bold;
            margin-top: 10px;
            color: #444;
            text-align: left;
            width: 100%;
            display: inline-block;
        }

        /* Button styling */
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* Canvas Styling */
        canvas {
            max-width: 100%;
            border: 1px solid #ddd;
            margin-top: 20px;
            display: none;
            border-radius: 8px;
        }

        /* Hidden Elements */
        .hidden {
            display: none;
        }

        /* Responsive Design for Mobile */
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            
            button {
                font-size: 1.2rem;
                padding: 16px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <img id="bannerDisplay" alt="Campaign Banner">

    <h2>Campaign Frame Generator</h2>

    <label for="campaignSelect">1. Select Campaign</label>
    <select id="campaignSelect">
        <option value="" disabled selected>Loading...</option>
    </select>

    <div id="controls" class="hidden">
        <label for="formatSelect">2. Select Format</label>
        <select id="formatSelect"></select>

        <label for="userText">3. Enter Your Name</label>
        <input type="text" id="userText" placeholder="Your Name">

        <label for="userImage">4. Upload Your Photo</label>
        <input type="file" id="userImage" accept="image/*">
    </div>

    <canvas id="canvas"></canvas>

    <button id="downloadBtn" style="display:none;">Download Image</button>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const campaignSelect = document.getElementById('campaignSelect');
    const formatSelect = document.getElementById('formatSelect');
    const bannerDisplay = document.getElementById('bannerDisplay');
    const controls = document.getElementById('controls');
    
    let campaigns = [];
    let currentCampaign = null;
    let frameImg = new Image();
    let userImg = new Image();
    let isFrameLoaded = false, isUserLoaded = false;

    // Load Data
    fetch('config.json?t=' + Date.now())
        .then(res => res.json())
        .then(data => {
            campaigns = data;
            campaignSelect.innerHTML = '<option value="" disabled selected>Select a Campaign</option>';
            data.forEach((c, i) => {
                let opt = document.createElement('option');
                opt.value = i;
                opt.textContent = c.name;
                campaignSelect.appendChild(opt);
            });
        });

    // 1. Campaign Selected -> Show Banner & Load Formats
    campaignSelect.addEventListener('change', (e) => {
        currentCampaign = campaigns[e.target.value];
        
        // Show Banner
        if(currentCampaign.bannerUrl) {
            bannerDisplay.src = currentCampaign.bannerUrl;
            bannerDisplay.style.display = "block";
        } else {
            bannerDisplay.style.display = "none";
        }

        // Setup Formats
        formatSelect.innerHTML = '';
        currentCampaign.frames.forEach((f, i) => {
            let opt = document.createElement('option');
            opt.value = i;
            opt.textContent = f.type;
            formatSelect.appendChild(opt);
        });

        // Set Defaults
        document.getElementById('userText').value = currentCampaign.defaultText || "";
        controls.classList.remove('hidden');
        loadFrame(0);
    });

    formatSelect.addEventListener('change', (e) => loadFrame(e.target.value));

    function loadFrame(index) {
        isFrameLoaded = false;
        frameImg.src = currentCampaign.frames[index].url;
        frameImg.onload = () => { isFrameLoaded = true; draw(); };
    }

    document.getElementById('userImage').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            userImg.src = ev.target.result;
            userImg.onload = () => { isUserLoaded = true; draw(); };
        };
        reader.readAsDataURL(file);
    });

    document.getElementById('userText').addEventListener('input', draw);

    function draw() {
        if (!isFrameLoaded || !isUserLoaded) return;

        canvas.width = frameImg.width;
        canvas.height = frameImg.height;

        // Draw User Image (Center Crop)
        const ratio = Math.max(canvas.width / userImg.width, canvas.height / userImg.height);
        const centerShift_x = (canvas.width - userImg.width * ratio) / 2;
        const centerShift_y = (canvas.height - userImg.height * ratio) / 2;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(userImg, 0, 0, userImg.width, userImg.height, 
                      centerShift_x, centerShift_y, userImg.width * ratio, userImg.height * ratio);

        // Draw Frame
        ctx.drawImage(frameImg, 0, 0);

        // Draw Text
        const text = document.getElementById('userText').value;
        if (text) {
            ctx.font = `bold ${canvas.height * 0.05}px Arial`;
            ctx.fillStyle = currentCampaign.textColor || "white";
            ctx.textAlign = "center";
            ctx.shadowColor="black";
            ctx.shadowBlur=5;
            ctx.fillText(text, canvas.width / 2, canvas.height - (canvas.height * 0.1));
        }

        canvas.style.display = "block";
        document.getElementById('downloadBtn').style.display = "inline-block";
    }

    document.getElementById('downloadBtn').addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = 'badge.png';
        link.href = canvas.toDataURL();
        link.click();
    });
</script>

</body>
</html>
