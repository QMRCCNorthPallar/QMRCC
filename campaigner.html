<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campaign Frame Generator</title>
<style>
/* ------------------------ */
/* GLOBAL RESET */
/* ------------------------ */
* { margin:0; padding:0; box-sizing:border-box; font-family:"Roboto",sans-serif; }

/* ------------------------ */
/* BACKGROUND & CONTAINER */
/* ------------------------ */
body {
  min-height:100vh;
  display:flex; justify-content:center; align-items:center;
  background:#f1f3f4; padding:20px;
}
.container {
  width:100%; max-width:650px;
  background:#fff; padding:24px;
  border-radius:16px; box-shadow:0 8px 24px rgba(0,0,0,0.15);
  text-align:center;
}
h2 { margin-bottom:20px; color:#202124; font-weight:500; }

/* ------------------------ */
/* BANNER & CANVAS */
/* ------------------------ */
#bannerDisplay, canvas { width:100%; border-radius:12px; margin-bottom:16px; display:none; }
canvas { box-shadow:0 6px 25px rgba(0,0,0,0.15); }

/* ------------------------ */
/* INPUTS & SELECTS */
/* ------------------------ */
label { display:block; margin-top:12px; margin-bottom:6px; text-align:left; font-size:0.95rem; color:#3c4043; }
select, input[type="text"], input[type="file"] {
  width:100%; padding:12px; border-radius:8px;
  border:1px solid #dadce0; outline:none;
  font-size:1rem; margin-bottom:12px;
}
button {
  margin-top:16px; width:100%; padding:14px;
  border:none; border-radius:10px;
  background:#1a73e8; color:#fff; font-size:1rem; cursor:pointer;
}
button:hover { background:#1765c1; }

/* Hide sections */
.hidden { display:none; }

/* MOBILE */
@media(max-width:600px){ .container{ padding:16px; } h2{ font-size:1.4rem; } }
</style>
</head>
<body>

<div class="container">

  <img id="bannerDisplay" alt="Campaign Banner">
  <h2>Campaign Frame Generator</h2>

  <label for="campaignSelect">1. Select Campaign</label>
  <select id="campaignSelect"><option disabled selected>Loading...</option></select>

  <div id="controls" class="hidden">
    <label for="formatSelect">2. Select Frame</label>
    <select id="formatSelect"></select>

    <label for="userText">3. Enter Your Name</label>
    <input type="text" id="userText" placeholder="Your Name">

    <label for="userImage">4. Upload Your Photo</label>
    <input type="file" id="userImage" accept="image/*">
  </div>

  <canvas id="canvas"></canvas>
  <button id="downloadBtn" style="display:none;">Download Image</button>

</div>

<script>
/* ------------------------ */
/* CONFIG */
/* ------------------------ */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const campaignSelect = document.getElementById('campaignSelect');
const formatSelect = document.getElementById('formatSelect');
const bannerDisplay = document.getElementById('bannerDisplay');
const controls = document.getElementById('controls');
const downloadBtn = document.getElementById('downloadBtn');

const GITHUB_RAW_PREFIX = 'https://raw.githubusercontent.com/QMRCCNorthPallar/QMRCC/main/';

let campaigns = [];
let currentCampaign = null;
let frameImg = new Image();
let userImg = new Image();
let isFrameLoaded = false, isUserLoaded = false;

/* ------------------------ */
/* LOAD CONFIG.JSON */
/* ------------------------ */
fetch(GITHUB_RAW_PREFIX + 'config.json?t=' + Date.now())
  .then(res => res.json())
  .then(data => {
    campaigns = data;
    campaignSelect.innerHTML = '<option value="" disabled selected>Select a Campaign</option>';
    data.forEach((c,i)=>{
      let opt = document.createElement('option');
      opt.value = i; opt.textContent = c.name;
      campaignSelect.appendChild(opt);
    });
  })
  .catch(err => { campaignSelect.innerHTML='<option disabled>No campaigns found</option>'; });

/* ------------------------ */
/* SELECT CAMPAIGN */
/* ------------------------ */
campaignSelect.addEventListener('change', e=>{
  currentCampaign = campaigns[e.target.value];

  // banner
  if(currentCampaign.bannerUrl){
    bannerDisplay.src = GITHUB_RAW_PREFIX + currentCampaign.bannerUrl;
    bannerDisplay.style.display = "block";
  } else bannerDisplay.style.display="none";

  // frames
  formatSelect.innerHTML='';
  currentCampaign.frames.forEach((f,i)=>{
    let opt = document.createElement('option');
    opt.value=i; opt.textContent=f.type; formatSelect.appendChild(opt);
  });

  document.getElementById('userText').value = currentCampaign.defaultText || "";
  controls.classList.remove('hidden');
  loadFrame(0);
});

/* ------------------------ */
/* SELECT FRAME */
formatSelect.addEventListener('change', e=>loadFrame(e.target.value));

function loadFrame(index){
  isFrameLoaded=false;
  frameImg.src = GITHUB_RAW_PREFIX + currentCampaign.frames[index].url;
  frameImg.onload = ()=>{ isFrameLoaded=true; draw(); };
}

/* ------------------------ */
/* LOAD USER IMAGE */
document.getElementById('userImage').addEventListener('change', e=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    userImg.src = ev.target.result;
    userImg.onload = ()=>{ isUserLoaded=true; draw(); };
  };
  reader.readAsDataURL(file);
});

/* ------------------------ */
/* USER TEXT INPUT */
document.getElementById('userText').addEventListener('input', draw);

/* ------------------------ */
/* DRAW CANVAS */
function draw(){
  if(!isFrameLoaded || !isUserLoaded) return;

  canvas.width = frameImg.width;
  canvas.height = frameImg.height;

  // fit user image
  const ratio = Math.max(canvas.width/userImg.width, canvas.height/userImg.height);
  const shiftX = (canvas.width - userImg.width*ratio)/2;
  const shiftY = (canvas.height - userImg.height*ratio)/2;

  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(userImg,0,0,userImg.width,userImg.height, shiftX,shiftY,userImg.width*ratio,userImg.height*ratio);
  ctx.drawImage(frameImg,0,0);

  // draw text
  const text = document.getElementById('userText').value;
  if(text){
    ctx.font = `bold ${canvas.height*0.05}px Arial`;
    ctx.fillStyle = currentCampaign.textColor || "white";
    ctx.textAlign="center";
    ctx.shadowColor="black"; ctx.shadowBlur=6;
    ctx.fillText(text, canvas.width/2, canvas.height - canvas.height*0.1);
  }

  canvas.style.display="block";
  downloadBtn.style.display="inline-block";
}

/* ------------------------ */
/* DOWNLOAD */
downloadBtn.addEventListener('click', ()=>{
  const link=document.createElement('a');
  link.download='campaign_frame.png';
  link.href=canvas.toDataURL();
  link.click();
});
</script>
</body>
</html>
