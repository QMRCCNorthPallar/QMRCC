<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QMRCC Admin - Photo Frame Manager</title>
<link href="/style.css" rel="stylesheet">
<style>
body { font-family: 'Rubik', sans-serif; background: #f7faf7; margin:0; padding:0;}
.container { max-width: 900px; margin:2rem auto; padding:1.5rem; background:#fff; border-radius:1rem; box-shadow:0 8px 32px rgba(31,164,99,0.1);}
h2 { color:#1fa463; text-align:center; margin-bottom:1rem;}
section { margin-bottom:2rem;}
label { font-weight:600; color:#1fa463;}
input, select, textarea, button { font-family: 'Rubik', sans-serif; }
button { background: linear-gradient(90deg,#1fa463 60%,#2be08a 100%); color:#fff; border:none; padding:0.5rem 1rem; border-radius:0.7rem; cursor:pointer; margin-top:0.5rem; transition:0.2s;}
button:hover { background: linear-gradient(90deg,#2be08a 60%,#1fa463 100%);}
.frame-preview, .banner-preview { width:150px; margin:0.5rem; border:1px solid #ccc; border-radius:0.5rem; display:inline-block; }
.frame-preview img, .banner-preview img { width:100%; border-radius:0.5rem; }
.metrics { background:#e7f5e7; padding:1rem; border-radius:0.7rem; display:flex; gap:1rem; flex-wrap:wrap;}
.metrics div { flex:1 1 30%; font-weight:600; color:#1a3d2b;}
</style>
</head>
<body>
<div class="container">
    <h2>Admin Panel - Photo Frame Manager</h2>

    <!-- Password -->
    <section id="login-section">
        <label for="adminPassword">Admin Password:</label>
        <input type="password" id="adminPassword" placeholder="Enter password">
        <button id="loginBtn">Login</button>
    </section>

    <!-- Frame Manager -->
    <section id="frame-section" style="display:none;">
        <h3>Frames</h3>
        <label>Upload Frame (Vertical or Landscape):</label>
        <input type="file" id="frameUpload" accept="image/png, image/jpeg">
        <select id="frameOrientation">
            <option value="vertical">Vertical (1080x1350)</option>
            <option value="landscape">Landscape (16:9)</option>
        </select>
        <button id="uploadFrameBtn">Upload Frame</button>
        <div id="frameList"></div>
    </section>

    <!-- Banner Manager -->
    <section id="banner-section" style="display:none;">
        <h3>Banners / Ads</h3>
        <label>Upload Banner Image:</label>
        <input type="file" id="bannerUpload" accept="image/png, image/jpeg">
        <button id="uploadBannerBtn">Upload Banner</button>
        <div id="bannerList"></div>
    </section>

    <!-- Text/Message Manager -->
    <section id="text-section" style="display:none;">
        <h3>Front Page Texts</h3>
        <label for="frontText">Message / Banner Text:</label>
        <textarea id="frontText" rows="3" style="width:100%;"></textarea>
        <button id="updateTextBtn">Update Text</button>
    </section>

    <!-- Metrics -->
    <section id="metrics-section" style="display:none;">
        <h3>Metrics</h3>
        <div class="metrics" id="metricsContainer">Loading...</div>
    </section>
</div>

<script src="admin.js"></script>
</body>
</html>
